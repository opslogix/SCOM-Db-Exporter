name: .NET Framework 4.7.2

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore
        run: nuget restore ScomDbExporter.sln

      - name: Build
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe

          if (-not $msbuild) {
            throw "MSBuild not found"
          }

          & $msbuild ScomDbExporter.sln /p:Configuration=Release

      # ✅ Package with deduplication (no duplicates, subfolders such as Mappings\ kept)
      - name: Package Release
        shell: pwsh
        run: |
          $artifactDir = "artifacts"
          $stageDir = "$artifactDir/stage"
          $safeName = "${{ github.ref_name }}" -replace '[/\\:*?"<>|]', '-'
          $zip = "$artifactDir/ScomDbExporter-$safeName.zip"

          New-Item -ItemType Directory -Force $stageDir | Out-Null

          # Collect all Release files with their path relative to bin\Release
          $roots = "ScomDbExporter\bin\Release",
                   "ScomDbExporter.Console\bin\Release",
                   "ScomDbExporter.Service\bin\Release"

          $files = foreach ($root in $roots) {
            $rootPath = (Resolve-Path $root).Path
            Get-ChildItem -Recurse -File $rootPath | ForEach-Object {
              [pscustomobject]@{
                FullName = $_.FullName
                Relative = $_.FullName.Substring($rootPath.Length).TrimStart('\', '/')
              }
            }
          }

          if (-not $files) {
            throw "No files found to package"
          }

          # Deduplicate by relative path (first occurrence wins). Passing the files
          # themselves to Compress-Archive would put every file at the ZIP root, and
          # the exporter only reads mapping files from the Mappings folder.
          $files |
            Sort-Object FullName |
            Group-Object Relative |
            ForEach-Object {
              $dest = Join-Path $stageDir $_.Name
              New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
              Copy-Item $_.Group[0].FullName $dest
            }

          if (-not (Test-Path "$stageDir/Mappings/*.json")) {
            throw "Mappings folder is missing from the package"
          }

          Compress-Archive `
            -Path "$stageDir/*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            throw "Artifact ZIP was not created"
          }

      # ✅ CI artifact (always visible in Actions UI)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScomDbExporter
          path: artifacts/*.zip

      # ✅ GitHub Release (tags only)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
